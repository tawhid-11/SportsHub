<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card shadow-lg p-4">

    <!-- Logo & Header -->
    <div class="text-center mb-4">
      <img src="assets/image/SportsHub.png" alt="SportsHub Logo" class="logo-img mb-2">
      <h3 class="fw-bold">SPORTSHUB</h3>
      <p class="text-muted small">Login to access all features</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <!-- Email -->
      <div class="mb-3 input-group input-group-lg">
        <input
          type="email"
          class="form-control rounded-start"
          placeholder="Email"
          name="email"
          [(ngModel)]="loginData.email"
          required
        />
        <span class="input-group-text bg-white rounded-end">
          <i class="bi bi-envelope-fill"></i>
        </span>
      </div>

      <!-- Password -->
      <div class="mb-3 input-group input-group-lg">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control rounded-start"
          placeholder="Password"
          name="password"
          [(ngModel)]="loginData.password"
          required
        />
        <span
          class="input-group-text bg-white cursor-pointer rounded-end"
          (click)="togglePassword()"
        >
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
        </span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="small text-decoration-none">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn btn-login w-100 mb-3"
        [disabled]="!loginForm.valid"
      >
        LOGIN
      </button>
    </form>

    <!-- Divider -->
    <div class="divider my-3"><span>or continue with</span></div>

    <!-- Register Link -->
    <p class="text-center small mb-0">
      Don’t have an account?
      <a routerLink="/register" class="signup-link">Register</a>
    </p>

  </div>
</div>
