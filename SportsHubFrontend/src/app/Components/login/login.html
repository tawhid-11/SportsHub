<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card shadow-lg p-4">

    <!-- Logo & Header -->
    <div class="text-center mb-5">
      <div class="logo-container mb-3">
        <img src="assets/image/SportsHub.png" alt="SportsHub Logo" class="logo-img">
      </div>
      <h2 class="fw-800 text-white letter-spacing-2">SPORTSHUB</h2>
      <p class="text-indigo-subtle small">Management platform for elite athletes</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <!-- Email -->
      <div class="mb-3 input-group input-group-lg">
        <input
          type="email"
          class="form-control"
          placeholder="Email address"
          name="email"
          [(ngModel)]="loginData.email"
          required
        />
        <span class="input-group-text">
          <i class="bi bi-envelope-fill"></i>
        </span>
      </div>

      <!-- Password -->
      <div class="mb-3 input-group input-group-lg">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          placeholder="Password"
          name="password"
          [(ngModel)]="loginData.password"
          required
        />
        <span
          class="input-group-text cursor-pointer"
          (click)="togglePassword()"
        >
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
        </span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label small text-white-50" for="rememberMe">Remember me</label>
        </div>
        <a routerLink="/forgot-password" class="small text-indigo-subtle text-decoration-none">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn btn-login w-100 mb-3"
        [disabled]="!loginForm.valid"
      >
        LOGIN
      </button>
    </form>

    <!-- Divider -->
    <div class="divider my-3"><span>or continue with</span></div>

    <!-- Register Link -->
    <p class="text-center small mb-0 text-white-50">
      Don’t have an account?
      <a routerLink="/register" class="signup-link">Join the movement</a>
    </p>

  </div>
</div>
