<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card shadow-lg p-4 animate-fade-in">
    
    <div class="text-center mb-5">
      <div class="logo-container mb-3">
        <img src="assets/image/SportsHub.png" alt="SportsHub Logo" class="logo-img">
      </div>
      <h2 class="fw-800 text-white letter-spacing-2">RECOVERY</h2>
      <p class="text-indigo-subtle small">Secure your elite access</p>
    </div>

    <!-- Alert Box -->
    <div *ngIf="message" 
         class="alert border-0 rounded-4 shadow-lg mb-4 py-3 small animate-fade-in"
         [class.alert-danger]="isError"
         [class.bg-danger]="isError"
         [class.alert-success]="!isError"
         [class.bg-success]="!isError"
         [class.text-white]="true">
      <div class="d-flex align-items-center justify-content-center text-center">
        <i class="bi" [class.bi-exclamation-octagon-fill]="isError" [class.bi-check-circle-fill]="!isError"></i>
        <span class="ms-2">{{ message }}</span>
      </div>
    </div>

    <!-- STEP 1: Identification -->
    <div *ngIf="step === 1">
      <div class="mb-4">
        <label class="form-label text-white-50 small mb-2">SELECT RECOVERY METHOD</label>
        <div class="d-flex gap-2">
          <button class="btn method-btn flex-fill" 
                  [class.active]="method === 'Email'"
                  (click)="method = 'Email'">
            <i class="bi bi-envelope me-2"></i>Email
          </button>
          <button class="btn method-btn flex-fill" 
                  [class.active]="method === 'Phone'"
                  (click)="method = 'Phone'">
            <i class="bi bi-phone me-2"></i>Phone
          </button>
        </div>
      </div>

      <div class="mb-4">
        <input type="text" 
               class="form-control" 
               [placeholder]="method === 'Email' ? 'Enter registered email' : 'Enter registered phone number'" 
               [(ngModel)]="target">
      </div>

      <button class="btn btn-indigo w-100 fw-bold py-3" 
              [disabled]="loading || !target"
              (click)="sendOTP()">
        <span *ngIf="!loading">SEND VERIFICATION CODE</span>
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
      </button>
    </div>

    <!-- STEP 2: OTP Verification -->
    <div *ngIf="step === 2" class="animate-bounce-in">
      <div class="text-center mb-4 text-white-50 small">
        Enter the 6-digit code sent to <br>
        <strong class="text-white">{{ target }}</strong>
      </div>

      <div class="mb-4">
        <input type="text" 
               class="form-control text-center otp-input" 
               placeholder="000000" 
               maxlength="6"
               [(ngModel)]="otp">
      </div>

      <button class="btn btn-indigo w-100 fw-bold py-3" 
              [disabled]="loading || otp.length < 6"
              (click)="verifyOTP()">
        VERIFY & CONTINUE
      </button>

      <div class="text-center mt-3">
        <a (click)="step = 1" class="text-indigo-subtle small cursor-pointer text-decoration-none">Change contact method</a>
      </div>
    </div>

    <!-- STEP 3: New Password -->
    <div *ngIf="step === 3" class="animate-fade-in">
      <div class="mb-3">
        <input type="password" 
               class="form-control" 
               placeholder="Enter new password" 
               [(ngModel)]="newPassword">
      </div>
      <div class="mb-4">
        <input type="password" 
               class="form-control" 
               placeholder="Confirm new password" 
               [(ngModel)]="confirmPassword">
      </div>

      <button class="btn btn-indigo w-100 fw-bold py-3" 
              [disabled]="loading || !newPassword || newPassword !== confirmPassword"
              (click)="resetPassword()">
        RESET PASSWORD NOW
      </button>
    </div>

    <div class="text-center mt-4 border-top border-secondary-subtle pt-4">
      <a routerLink="/login" class="login-link small">Back to secure login</a>
    </div>

  </div>
</div>
