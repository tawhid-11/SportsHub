<div class="container-fluid mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">User Information List</h4>
  </div>

  <!-- Table -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-bordered table-hover table-striped align-middle mb-0">
      <thead class="table-dark text-center">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>User Type</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of users">
          <td class="text-center">{{ item.UserID || item.Id }}</td>
          <td>{{ item.Name }}</td>
          <td>{{ item.Email }}</td>
          <td>{{ item.Phone }}</td>
          <td class="text-center">
            <span class="badge bg-primary" *ngIf="item.UserType === 'Admin'">Admin</span>
            <span class="badge bg-success" *ngIf="item.UserType === 'TeamOwner'">Team Owner</span>
            <span class="badge bg-info" *ngIf="item.UserType === 'Player'">Player</span>
            <span class="badge bg-secondary" *ngIf="item.UserType !== 'Admin' && item.UserType !== 'TeamOwner' && item.UserType !== 'Player'">
              {{ item.UserType }}
            </span>
          </td>
        </tr>

        <!-- No Data -->
        <tr *ngIf="users.length === 0">
          <td colspan="6" class="text-center text-muted py-4">
            No users available
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
