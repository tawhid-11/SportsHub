<div class="registration-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="registration-card shadow-lg p-4">

    <!-- Logo & Header -->
    <div class="text-center mb-5">
      <div class="logo-container mb-3">
        <img src="assets/image/SportsHub.png" alt="SportsHub Logo" class="logo-img">
      </div>
      <h2 class="fw-800 text-white letter-spacing-2">SPORTSHUB</h2>
      <p class="text-indigo-subtle small">Start your professional journey</p>
    </div>

    <!-- Error Message Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger border-0 rounded-4 shadow-lg mb-4 py-3 small animate-fade-in bg-danger text-white">
      <div class="d-flex align-items-center justify-content-center text-center">
        <i class="bi bi-exclamation-octagon-fill me-2 h5 mb-0"></i>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Registration Form -->
    <form (ngSubmit)="onRegister()" #registerForm="ngForm">

      <!-- Full Name -->
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Full Name" name="name"
          [(ngModel)]="registerData.name" required />
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email Address"
          name="email" [(ngModel)]="registerData.email" required />
      </div>

      <div class="mb-3">
        <input type="tel" class="form-control" placeholder="Phone Number" name="phone"
          [(ngModel)]="registerData.phone" required />
      </div>

      <div class="mb-3">
        <select class="form-select" name="userType" [(ngModel)]="registerData.userType"
          required>
          <option value="" disabled selected hidden>Role on Platform</option>
          <option value="TeamOwner">Team Owner</option>
          <option value="player">Professional Athlete</option>
        </select>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Create Password"
          name="password" [(ngModel)]="registerData.password" required />
      </div>

      <div class="mb-4">
        <input type="password" class="form-control" placeholder="Confirm Password"
          name="confirmPassword" [(ngModel)]="confirmPassword" required />
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-gradient w-100 fw-bold"
        [disabled]="!registerForm.valid">
        CREATE MY ACCOUNT
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center small mb-0 text-white-50">
      Already optimized for sports?
      <a (click)="onRoute()" class="login-link">Sign In Instead</a>
    </p>

  </div>
</div>
