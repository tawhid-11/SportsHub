<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="brand">
    <div class="logo-container">
      <div class="logo">
        <img src="assets/image/SportsHub.png" height="24" alt="" onerror="this.style.display='none'">
        <i class="bi bi-trophy-fill text-white" *ngIf="!hasLogo"></i>
      </div>
      <div class="title" *ngIf="!collapsed">SportsHub</div>
      <button class="collapse-btn" (click)="toggle.emit()">
        <i class="bi" [ngClass]="collapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>
  </div>

  <nav class="nav">
    <a
      class="nav-item"
      *ngFor="let item of nav"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      [title]="item.label"
    >
      <span class="icon">
        <i [class]="item.icon"></i>
      </span>
      <span class="label" *ngIf="!collapsed">{{ item.label }}</span>
    </a>

    <!-- Logout at bottom -->
    <a class="nav-item logout-item" (click)="logout()" title="Logout">
      <span class="icon"><i class="bi bi-box-arrow-right"></i></span>
      <span class="label" *ngIf="!collapsed">Sign Out</span>
    </a>
  </nav>

  <div class="bottom" *ngIf="!collapsed">
    <div class="user-profile">
      <div class="avatar-sm">
        {{ getUserInitials() }}
      </div>
      <div class="user-info-mini">
        <span class="user-name-mini">{{ getUserName() }}</span>
        <span class="user-role-mini text-uppercase">Admin Portal</span>
      </div>
    </div>
  </div>
</aside>
