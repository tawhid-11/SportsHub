<header class="header">
  <div class="search-container">
    <i class="bi bi-search"></i>
    <input type="text" class="search-input" placeholder="Search tournaments, players, teams...">
  </div>

  <div class="header-actions">
    <div class="action-btn" title="View Logs">
      <i class="bi bi-file-earmark-text"></i>
    </div>
    <div class="action-btn" title="Notifications">
      <i class="bi bi-bell"></i>
      <div class="badge-dot"></div>
    </div>
    
    <div class="user-snippet">
      <div class="user-status"></div>
      <div class="user-name">Welcome, Admin</div>
      <i class="bi bi-patch-check-fill text-indigo small"></i>
    </div>
  </div>
</header>
