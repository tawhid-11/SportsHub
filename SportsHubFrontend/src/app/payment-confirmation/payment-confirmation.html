<div class="payment-container text-center py-5">
  <div *ngIf="loading" class="spinner-section">
    <div class="spinner-border text-info" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h2 class="mt-3">Processing payment...</h2>
  </div>

  <div *ngIf="successMessage" class="success-section">
    <div class="success-icon mb-3">
      <span class="fs-1 text-success">✅</span>
    </div>
    <h2 class="text-success">{{ successMessage }}</h2>
    <p class="text-muted">Redirecting you to the home page...</p>
  </div>

  <div class="error-section" *ngIf="errorMessage">
    <div class="error-icon mb-3">
      <span class="fs-1 text-danger">❌</span>
    </div>
    <h2 class="text-danger">Payment Error</h2>
    <p class="error">
      {{ errorMessage }}
    </p>
  </div>
</div>
